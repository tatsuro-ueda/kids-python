<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>オフライン / Offline</title>
  <meta name="theme-color" content="#4a90c4">
  <style>
    body {
      font-family: sans-serif;
      color: #333;
      background-color: #f0e8fc;
      background-image: radial-gradient(#dcc8f5 10%, transparent 10%);
      background-size: 30px 30px;
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
    }
    .box { padding: 24px; }
    img { width: 96px; height: 96px; border-radius: 16px; }
    h1 { font-size: 1.3rem; color: #4a90c4; margin: 16px 0 8px; }
    p { margin: 4px 0; line-height: 1.6; }
    .en { color: #666; font-size: 0.9rem; }
  </style>
</head>
<body>
  <div class="box">
    <img src="/icons/icon-192.png" alt="">
    <h1>いまはインターネットにつながっていません</h1>
    <p>つながったら、もういちどひらいてね。</p>
    <p class="en">You are offline. Please reconnect and try again.</p>
  </div>
</body>
</html>
